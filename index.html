<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[SYSTEM HACK] Жөнөкөй Сандар - Crypto Breaker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="digital-rain" id="digitalRain"></div>
    <div class="scanline"></div>
    <div class="container">
        <header>
            <h1>[CRYPTO BREAKER]</h1>
            <p>Взломай систему правильными кодами...</p>
        </header>

        <div class="game-section">
            <div class="safe-container safe-3d-container">
                <div class="safe-door safe-door-3d" id="safeDoor">
                    <div class="safe-display">
                        <div class="target-number">
                            <span class="label">>> TARGET:</span>
                            <span class="number" id="targetNumber">12</span>
                        </div>
                        <div class="instruction">
                            [ЗАДАЧА]: Найди правильный код
                        </div>
                    </div>

                    <div class="input-section">
                        <div class="input-group">
                            <input type="number" id="factor1" placeholder="КОД_1" min="2">
                            <span class="multiply">×</span>
                            <input type="number" id="factor2" placeholder="КОД_2" min="2">
                            <span class="multiply">×</span>
                            <input type="number" id="factor3" placeholder="КОД_3" min="2">
                        </div>
                        <button class="btn-check" onclick="checkAnswer()">[АТАКА]</button>
                    </div>

                    <div class="result" id="result"></div>
                </div>

                <div class="safe-opened safe-content-3d" id="safeOpened" style="display: none;">
                    <div class="success-message">
                        <div class="lock-mechanism">🔓</div>
                        <h2>[СЕЙФ АЧЫЛДЫ]</h2>
                        <p id="hackText">SYSTEM HACKED...</p>
                        <button class="btn-new" onclick="newGame()">[ЖАҢЫ МИССИЯ]</button>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <script src="script.js"></script>
</body>
</html>
